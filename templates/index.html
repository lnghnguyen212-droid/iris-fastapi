<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân Loại Hoa Diên Vĩ - SVM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row g-3">
            <!-- CỘT TRÁI: NHẬP THÔNG SỐ & CẤU HÌNH -->
            <div class="col-lg-4">
                <div class="card-custom">
                    <div class="card-title">
                        <i class="bi bi-sliders"></i> Cấu Hình Mô Hình
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small text-muted">Chọn Kernel SVM:</label>
                        <select id="kernelSelect" class="form-select form-select-sm" onchange="onKernelChange()">
                            <option value="linear" selected>Linear (Tuyến tính)</option>
                            <option value="rbf">RBF (Radial Basis Function)</option>
                            <option value="poly">Polynomial (Đa thức)</option>
                            <option value="sigmoid">Sigmoid</option>
                        </select>
                    </div>

                    <hr class="border-secondary my-3">

                    <!-- 4 SLIDERS NHẬP THÔNG SỐ -->
                    <div class="mb-2">
                        <div class="d-flex justify-content-between small">
                            <label>Chiều dài đài hoa (Sepal Length):</label>
                            <span id="sl_val" class="fw-bold text-info">5.1 cm</span>
                        </div>
                        <input type="range" class="form-range" id="sepal_length" min="4.0" max="8.0" step="0.1" value="5.1" oninput="updatePredict()">
                    </div>

                    <div class="mb-2">
                        <div class="d-flex justify-content-between small">
                            <label>Chiều rộng đài hoa (Sepal Width):</label>
                            <span id="sw_val" class="fw-bold text-info">3.5 cm</span>
                        </div>
                        <input type="range" class="form-range" id="sepal_width" min="2.0" max="4.5" step="0.1" value="3.5" oninput="updatePredict()">
                    </div>

                    <div class="mb-2">
                        <div class="d-flex justify-content-between small">
                            <label>Chiều dài cánh hoa (Petal Length):</label>
                            <span id="pl_val" class="fw-bold text-info">1.4 cm</span>
                        </div>
                        <input type="range" class="form-range" id="petal_length" min="1.0" max="7.0" step="0.1" value="1.4" oninput="updatePredict()">
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between small">
                            <label>Chiều rộng cánh hoa (Petal Width):</label>
                            <span id="pw_val" class="fw-bold text-info">0.2 cm</span>
                        </div>
                        <input type="range" class="form-range" id="petal_width" min="0.1" max="2.5" step="0.1" value="0.2" oninput="updatePredict()">
                    </div>

                    <button class="btn btn-primary w-100 mb-3" onclick="updatePredict()">
                        <i class="bi bi-cpu"></i> Phân Loại Ngay
                    </button>

                    <hr class="border-secondary my-3">

                    <div class="mb-2">
                        <label class="form-label small text-muted">Tải/Dán Ảnh Hoa Iris (Ctrl + V):</label>
                        <input type="file" id="fileInput" class="form-control form-control-sm" accept="image/*" onchange="handleFileSelect(event)">
                        <img id="uploadPreview" class="preview-img" alt="Preview">
                    </div>
                </div>
            </div>

            <!-- CỘT PHẢI: KẾT QUẢ, BIỂU ĐỒ & LỊCH SỬ -->
            <div class="col-lg-8">
                <div class="card-custom">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="card-title m-0">
                            <i class="bi bi-gear-wide-connected"></i> Kết Quả Phân Loại
                        </div>
                        <span id="kernelBadge" class="badge bg-primary px-3 py-2">KERNEL: LINEAR</span>
                    </div>

                    <div class="row align-items-center">
                        <div class="col-md-5 text-center d-flex flex-column align-items-center">
                            <div class="result-img-box mb-2">
                                <img id="resImg" src="" style="display:none;">
                                <span id="imgPlaceholder" class="text-muted small">Result Image</span>
                            </div>
                            <h5 id="resName" class="fw-bold text-warning m-0">Chưa xác định</h5>
                        </div>

                        <div class="col-md-7">
                            <div class="small fw-bold text-muted mb-2">Xác suất phân loại:</div>
                            
                            <div class="mb-2">
                                <div class="d-flex justify-content-between small">
                                    <span>Iris Setosa</span>
                                    <span id="prob_0">0%</span>
                                </div>
                                <div class="progress"><div id="bar_0" class="progress-bar bg-info" style="width: 0%"></div></div>
                            </div>

                            <div class="mb-2">
                                <div class="d-flex justify-content-between small">
                                    <span>Iris Versicolor</span>
                                    <span id="prob_1">0%</span>
                                </div>
                                <div class="progress"><div id="bar_1" class="progress-bar bg-warning" style="width: 0%"></div></div>
                            </div>

                            <div class="mb-2">
                                <div class="d-flex justify-content-between small">
                                    <span>Iris Virginica</span>
                                    <span id="prob_2">0%</span>
                                </div>
                                <div class="progress"><div id="bar_2" class="progress-bar bg-danger" style="width: 0%"></div></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="card-custom h-100">
                            <div style="height: 180px;">
                                <canvas id="barChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card-custom h-100">
                            <div class="d-flex justify-content-end mb-2">
                                <button class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="clearHistory()">Xóa</button>
                            </div>
                            <div class="table-responsive" style="max-height: 150px; overflow-y: auto;">
                                <table class="table table-sm table-dark-custom align-middle m-0">
                                    <thead>
                                        <tr>
                                            <th>Thời gian</th>
                                            <th>Kernel</th>
                                            <th>Kết quả</th>
                                        </tr>
                                    </thead>
                                    <tbody id="historyBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
