<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân Loại Hoa Diên Vĩ - SVM Kernel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a !important; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e293b !important; border: 1px solid #334155; border-radius: 12px; }
        .form-control, .form-select { border-radius: 8px; }
        .form-control:focus, .form-select:focus { background-color: #0f172a; color: #fff; border-color: #6366f1; }
    </style>
</head>
<body class="bg-dark text-light">

    <div class="container-fluid py-4">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-lg-4">
                <div class="card p-3 mb-3">
                    <h5 class="card-title text-primary"><i class="bi bi-sliders me-2"></i>Cấu Hình Mô Hình</h5>
                    <div class="mb-3">
                        <label class="form-label">Chọn Kernel SVM:</label>
                        <select id="kernelSelect" class="form-select bg-dark text-light border-secondary">
                            <option value="linear" selected>Linear (Tuyến tính)</option>
                            <option value="rbf">RBF (Radial Basis Function)</option>
                            <option value="poly">Polynomial (Đa thức)</option>
                            <option value="sigmoid">Sigmoid</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Tải/Dán Ảnh Hoa Iris:</label>
                        <input type="file" id="imageInput" class="form-control bg-dark text-light border-secondary" accept="image/*" onchange="handleFileSelect(event)">
                        <small class="text-muted mt-1 d-block">Hoặc bấm <strong>Ctrl + V</strong> để dán ảnh từ Clipboard.</small>
                    </div>

                    <div class="text-center mt-2">
                        <img id="previewImg" src="https://via.placeholder.com/150" class="img-thumbnail bg-dark border-secondary rounded" style="max-height: 150px;" alt="Preview">
                    </div>
                </div>
            </div>

            <!-- Kết quả -->
            <div class="col-lg-8">
                <div class="card p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="m-0"><i class="bi bi-flower1 me-2"></i>Kết Quả Phân Loại</h5>
                        <span id="usedKernelBadge" class="badge bg-primary fs-6"><i class="bi bi-cpu me-1"></i> KERNEL: LINEAR</span>
                    </div>
                    
                    <div class="row align-items-center">
                        <div class="col-md-4 text-center">
                            <img id="resImg" src="https://via.placeholder.com/200" class="img-fluid rounded border border-secondary mb-2" alt="Result Image">
                            <h4 id="resName" class="text-warning fw-bold m-0">Chưa xác định</h4>
                        </div>
                        <div class="col-md-8">
                            <p id="resDesc" class="text-muted small mb-3">Tải hoặc dán ảnh để mô hình nhận diện loài hoa Iris.</p>
                            
                            <h6>Xác suất phân loại:</h6>
                            <div class="mb-2">
                                <div class="d-flex justify-content-between small"><span>Iris Setosa</span><span id="prob_0">0%</span></div>
                                <div class="progress bg-dark" style="height: 8px;"><div id="bar_0" class="progress-bar bg-info" style="width: 0%"></div></div>
                            </div>
                            <div class="mb-2">
                                <div class="d-flex justify-content-between small"><span>Iris Versicolor</span><span id="prob_1">0%</span></div>
                                <div class="progress bg-dark" style="height: 8px;"><div id="bar_1" class="progress-bar bg-warning" style="width: 0%"></div></div>
                            </div>
                            <div class="mb-2">
                                <div class="d-flex justify-content-between small"><span>Iris Virginica</span><span id="prob_2">0%</span></div>
                                <div class="progress bg-dark" style="height: 8px;"><div id="bar_2" class="progress-bar bg-danger" style="width: 0%"></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function uploadAndPredictImage(fileBlob) {
            const selectedKernel = document.getElementById('kernelSelect').value;
            const formData = new FormData();
            if (fileBlob) formData.append('image', fileBlob);
            formData.append('kernel', selectedKernel);

            try {
                const response = await fetch('/predict', { method: 'POST', body: formData });
                const data = await response.json();
                
                document.getElementById('resName').innerText = data.name;
                document.getElementById('resDesc').innerText = data.desc;
                if (data.img) document.getElementById('resImg').src = data.img;
                document.getElementById('usedKernelBadge').innerHTML = `<i class="bi bi-cpu me-1"></i> KERNEL: ${data.used_kernel.toUpperCase()}`;

                const probs = data.probs || [0, 0, 0];
                for (let i = 0; i < 3; i++) {
                    document.getElementById(`prob_${i}`).innerText = probs[i] + '%';
                    document.getElementById(`bar_${i}`).style.width = probs[i] + '%';
                }
            } catch (err) {
                alert("Lỗi kết nối tới mô hình!");
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('previewImg').src = URL.createObjectURL(file);
                uploadAndPredictImage(file);
            }
        }

        document.addEventListener('paste', function (e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') === 0) {
                    const blob = item.getAsFile();
                    document.getElementById('previewImg').src = URL.createObjectURL(blob);
                    uploadAndPredictImage(blob);
                    break;
                }
            }
        });
    </script>
</body>
</html>
